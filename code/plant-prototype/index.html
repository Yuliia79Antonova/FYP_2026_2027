<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Plant Prototype</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #101612;
            color: #edf4ed;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #controls {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            width: 245px;
            padding: 18px;
            background: rgba(22, 34, 26, 0.94);
            border: 1px solid #405b45;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 5px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #a8bdaa;
            font-size: 12px;
        }

        .control {
            margin: 17px 0;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
            font-size: 14px;
        }

        output {
            color: #a9dba9;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #78bb7d;
            cursor: pointer;
        }

        .status-card {
            margin-top: 20px;
            padding: 12px;
            background: #293a2d;
            border-radius: 9px;
        }

        .status-label {
            color: #b4c7b5;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status {
            margin-top: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        #health-track {
            height: 6px;
            margin-top: 10px;
            overflow: hidden;
            background: #101912;
            border-radius: 4px;
        }

        #health-bar {
            width: 80%;
            height: 100%;
            background: #81c784;
            transition: width 0.2s;
        }

        #instructions {
            margin-top: 15px;
            color: #b4c7b5;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            #controls {
                top: 10px;
                left: 10px;
                width: 205px;
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<div id="controls">
    <h1>DIGITAL PLANT</h1>
    <div class="subtitle">Interactive plant prototype</div>

    <button id="plantSeedButton" style="
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        background: #4f9d69;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    ">Plant seed</button>

    <button id="collectSeedsButton" style="
        display: none;
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        background: #b58b55;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    ">Collect seeds</button>

    <div class="control">
        <div class="control-header">
            <label for="water">Water</label>
            <output id="water-value">0%</output>
        </div>
        <input id="water" type="range" min="0" max="100"
               value="0" step="5">
    </div>

    <div class="control">
        <div class="control-header">
            <label for="light">Light</label>
            <output id="light-value">0%</output>
        </div>
        <input id="light" type="range" min="0" max="100"
               value="0" step="5">
    </div>

    <div class="status-card">
        <div class="status-label">Plant condition</div>
        <div id="status">Healthy</div>
        <div id="health-track">
            <div id="health-bar"></div>
        </div>
    </div>

    <div id="instructions">
        Click on a leaf to grow a new one.
        Adjust water and light to influence growth and plant condition.
    </div>
</div>

<script type="importmap">
{

<script type="module">
import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

// =========================
// SCENE
// =========================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101612);

// =========================
// SOIL
// =========================

const soilGeometry = new THREE.SphereGeometry(1, 32, 16);

const soilMaterial = new THREE.MeshBasicMaterial({
    color: 0x59402b
});

const soil = new THREE.Mesh(soilGeometry, soilMaterial);
soil.scale.set(2.5, 0.35, 1.2);
soil.position.set(0, -1.8, 0);
scene.add(soil);

// =========================
// SEED
// =========================

const seedGeometry = new THREE.SphereGeometry(0.18, 24, 16);

const seedMaterial = new THREE.MeshBasicMaterial({
    color: 0x9b6b3e
});

const seed = new THREE.Mesh(seedGeometry, seedMaterial);
seed.scale.set(0.75, 1.2, 0.65);
seed.position.set(0, -1.3, 0);
scene.add(seed);

// =========================
// PLANT SEED INTERACTION
// =========================

const plantSeedButton = document.getElementById('plantSeedButton');
const collectSeedsButton = document.getElementById('collectSeedsButton');

let seedIsPlanted = false;
let seedsCollected = false;

// =========================
// PLANT GROUP
// =========================

const plantGroup = new THREE.Group();
scene.add(plantGroup);
plantGroup.visible = false;
plantGroup.scale.set(0.01, 0.01, 0.01);

let germinationProgress = 0;
let germinationStarted = false;
let continuedGrowth = 0;
let stemGrowth = 0;


// =========================
// MOUSE INTERACTION
// =========================

const mousePosition = new THREE.Vector2(0, 0);

let targetTiltX = 0;
let targetTiltZ = 0;

let currentTiltX = 0;
let currentTiltZ = 0;

window.addEventListener('mousemove', (event) => {
    mousePosition.x = (event.clientX / window.innerWidth) * 2 - 1;
    mousePosition.y = -(event.clientY / window.innerHeight) * 2 + 1;

    targetTiltZ = -mousePosition.x * 0.22;
    targetTiltX = mousePosition.y * 0.12;
});
// =========================
// CAMERA
// =========================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0.5, 7);

// =========================
// RENDERER
// =========================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// =========================
// PLANT STATE
// =========================

let water = 0;
let light = 0;
let health = 80;

const growingLeaves = [];
const allLeaves = [];
const allSproutLeaves = [];
const extraSproutLeaves = [];
const growingSproutLeaves = [];

// =========================
// WITHERING AND RECOVERY
// =========================

const leafRestRotations = new Map();
const leafDroopAmounts = new Map();

let plantStress = 0;
let currentSunburn = 0;

const healthyGreen = new THREE.Color(0x4f9d69);
const dryBrown = new THREE.Color(0x956b46);
const highlightedGreen = new THREE.Color(0x7fdc8f);

const clock = new THREE.Clock();

// =========================
// STEM
// =========================

// =========================
// BLENDER STEM
// =========================

const blenderStemMaterials = [];
let blenderStemModel = null;
const stemLoader = new GLTFLoader();

// Attach young leaves directly to the Blender stem.
// Position young leaves around the growing Blender stem.
function updateSproutLeafPositions() {
    if (!blenderStemModel) return;

    const stemHeight = 4.5 * stemGrowth;

    const leafLevels = [
        0.22, 0.22,
        0.48, 0.48,
        0.74, 0.74
    ];

    const leafAngles = [
        0,
        Math.PI,
        Math.PI / 2,
        Math.PI * 1.5,
        Math.PI / 4,
        Math.PI * 1.25
    ];

    allSproutLeaves.forEach((leaf, index) => {
        sproutGroup.add(leaf);

        const angle = leafAngles[index];

        leaf.position.set(
            Math.cos(angle) * 0.035,
            stemHeight * leafLevels[index],
            Math.sin(angle) * 0.035
        );

        leaf.rotation.y = angle;
    });
}

stemLoader.load('./stem.glb', (gltf) => {
    blenderStemModel = gltf.scene;
    const blenderStem = blenderStemModel;

    const box = new THREE.Box3().setFromObject(blenderStem);
    const center = box.getCenter(new THREE.Vector3());
    blenderStem.userData.originalMinY = box.min.y;

    blenderStem.scale.set(3, 3 * Math.max(0.01, stemGrowth), 3);

    // Place the bottom of the stem at the plant base.
    blenderStem.position.set(
        -center.x * 3,
        -box.min.y * 3,
        -center.z * 3
    );

    blenderStem.traverse((child) => {
        if (child.isMesh) {
            child.geometry.computeBoundingBox();

            console.log(
             'Stem geometry bounds:',
             child.geometry.boundingBox
);
            child.material = new THREE.MeshBasicMaterial({
                color: 0x78c96b,
                side: THREE.DoubleSide
            });

blenderStemMaterials.push(child.material);
        }
    });

    sproutGroup.add(blenderStem);
        updateSproutLeafPositions();
        // Find the actual top point of the Blender stem.
blenderStem.updateMatrixWorld(true);

let highestTip = null;
let highestY = -Infinity;

blenderStem.traverse((child) => {
    if (!child.isMesh) return;

    const positions = child.geometry.attributes.position;
    const vertex = new THREE.Vector3();

    for (let i = 0; i < positions.count; i++) {
        vertex.fromBufferAttribute(positions, i);

        child.localToWorld(vertex);
        blenderStem.worldToLocal(vertex);

        if (vertex.y > highestY) {
            highestY = vertex.y;
            highestTip = vertex.clone();
        }
    }
});

blenderStem.userData.tipLocal = highestTip;
    // Attach young leaves directly to the Blender stem.
    
    blenderStem.updateMatrixWorld(true);

    const stemBox = new THREE.Box3().setFromObject(blenderStem);
    console.log('Stem bounds:', stemBox.min, stemBox.max);

    console.log('Blender stem loaded into sproutGroup');
}, undefined, (error) => {
    console.error('Error loading Blender stem:', error);
});

// =========================
// CREATE LEAF
// =========================

function createLeaf(x, y, z, size, rotationZ) {
    const shape = new THREE.Shape();

    shape.moveTo(0, 0);

    shape.bezierCurveTo(
        -0.15, 0.35,
        -0.75, 0.65,
        -0.95, 1.25
    );

    shape.bezierCurveTo(
        -0.65, 1.85,
        -0.25, 2.25,
        0, 2.6
    );

    shape.bezierCurveTo(
        0.25, 2.25,
        0.65, 1.85,
        0.95, 1.25
    );

    shape.bezierCurveTo(
        0.75, 0.65,
        0.15, 0.35,
        0, 0
    );

    const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.10,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 2
    });

    const material = new THREE.MeshBasicMaterial({
        color: healthyGreen.clone(),
        side: THREE.DoubleSide
    });

    const leaf = new THREE.Mesh(geometry, material);

    leaf.scale.set(size, size, size);
    leaf.position.set(x, y, z);
    leaf.rotation.z = rotationZ;

    leafRestRotations.set(leaf, rotationZ);
    leafDroopAmounts.set(leaf, 0);

    leaf.rotation.x = 0.15;
    leaf.userData.originalRotationX = leaf.rotation.x;
    leaf.userData.baseColor = healthyGreen.clone();

    plantGroup.add(leaf);
    allLeaves.push(leaf);

    return leaf;
}

// =========================
// NEW SPROUT
// =========================

const sproutGroup = new THREE.Group();
sproutGroup.position.set(0, -1.55, 0);
scene.add(sproutGroup);
sproutGroup.visible = false;

const sproutCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.15, 0),
    new THREE.Vector3(0.02, 0.15, 0),
    new THREE.Vector3(0.12, 0.40, 0),
    new THREE.Vector3(0.28, 0.50, 0)
]);

const sproutGeometry = new THREE.TubeGeometry(
    sproutCurve, 20, 0.045, 8, false
);

const sproutMaterial = new THREE.MeshBasicMaterial({
    color: 0x78bb7d
});

const sprout = new THREE.Mesh(sproutGeometry, sproutMaterial);
sprout.visible = false;
sproutGroup.add(sprout);



// =========================
// FLOWER BUD
// =========================

const budGeometry = new THREE.SphereGeometry(0.09, 16, 12);

const budMaterial = new THREE.MeshBasicMaterial({
    color: 0x78bb7d
});

const bud = new THREE.Mesh(budGeometry, budMaterial);
bud.position.set(0, 0, 0);
bud.scale.set(0.001, 0.001, 0.001);
sproutGroup.add(bud);

// =========================
// FLOWER CENTER
// =========================

const flowerCenterGeometry = new THREE.SphereGeometry(
    0.055, 12, 10
);

const flowerCenterMaterial = new THREE.MeshBasicMaterial({
    color: 0xf2c14e
});

const flowerCenter = new THREE.Mesh(
    flowerCenterGeometry,
    flowerCenterMaterial
);

flowerCenter.scale.set(0.001, 0.001, 0.001);
bud.add(flowerCenter);

// =========================
// FLOWER PETALS
// =========================

const petalMaterial = new THREE.MeshBasicMaterial({
    color: 0xe88bb5,
    side: THREE.DoubleSide
});

const petalGeometry = new THREE.SphereGeometry(0.07, 12, 10);
const petals = [];

for (let i = 0; i < 6; i++) {
    const petal = new THREE.Mesh(petalGeometry, petalMaterial);

    petal.position.set(0, 0, 0);
    petal.scale.set(0.001, 0.001, 0.001);

    bud.add(petal);
    petals.push(petal);
}

// =========================
// SEEDS
// =========================

const flowerSeedMaterial = new THREE.MeshBasicMaterial({
    color: 0x8b6b3f
});

const flowerSeedGeometry = new THREE.SphereGeometry(0.018, 8, 6);
const seeds = [];

for (let i = 0; i < 5; i++) {
    const flowerSeed = new THREE.Mesh(
        flowerSeedGeometry,
        flowerSeedMaterial
    );

    flowerSeed.position.set(
        Math.cos((i / 5) * Math.PI * 2) * 0.04,
        Math.sin((i / 5) * Math.PI * 2) * 0.04,
        0.02
    );

    flowerSeed.scale.set(0.001, 0.001, 0.001);
    bud.add(flowerSeed);
    seeds.push(flowerSeed);
}

// Get a point on the stem curve.
function getStemPoint(t) {
    return sproutCurve.getPointAt(t);
}

// =========================
// CREATE YOUNG LEAVES
// =========================

function createSproutLeaf(x, y, rotationZ, track = true) {
    const leafShape = new THREE.Shape();

    leafShape.moveTo(0, 0);
    leafShape.quadraticCurveTo(0.30, 0.05, 0.55, 0.25);
    leafShape.quadraticCurveTo(0.35, 0.45, 0, 0);

    const leafGeometry = new THREE.ShapeGeometry(leafShape);

    const leafMaterial = new THREE.MeshBasicMaterial({
        color: 0x78bb7d,
        side: THREE.DoubleSide
    });

    const leaf = new THREE.Mesh(leafGeometry, leafMaterial);

    leaf.scale.set(1.2, 0.55, 0.2);
    leaf.position.set(x, y, 0);
    leaf.rotation.z = rotationZ;
    leaf.visible = false;

    leaf.userData.originalRotationZ = rotationZ;
    leaf.userData.droopDirection = rotationZ > 1 ? 1 : -1;

    sproutGroup.add(leaf);
    if (track) {
    allSproutLeaves.push(leaf);
    } else {
    extraSproutLeaves.push(leaf);
    }   

    return leaf;
}

// Attach the pairs of leaves to the stem curve.
const leftLeafPoint1 = getStemPoint(0.45);
const rightLeafPoint1 = getStemPoint(0.55);

const leftLeafPoint2 = getStemPoint(0.65);
const rightLeafPoint2 = getStemPoint(0.72);

const leftLeafPoint3 = getStemPoint(0.82);
const rightLeafPoint3 = getStemPoint(0.90);

const sproutLeafLeft = createSproutLeaf(
    leftLeafPoint1.x, leftLeafPoint1.y, 2.7
);

const sproutLeafRight = createSproutLeaf(
    rightLeafPoint1.x, rightLeafPoint1.y, 0.3
);

const sproutLeafLeft2 = createSproutLeaf(
    leftLeafPoint2.x, leftLeafPoint2.y, 2.7
);

const sproutLeafRight2 = createSproutLeaf(
    rightLeafPoint2.x, rightLeafPoint2.y, 0.3
);

const sproutLeafLeft3 = createSproutLeaf(
    leftLeafPoint3.x, leftLeafPoint3.y, 2.7
);

const sproutLeafRight3 = createSproutLeaf(
    rightLeafPoint3.x, rightLeafPoint3.y, 0.3
);
updateSproutLeafPositions();
    

// =========================
// ORIGINAL LEAVES
// =========================

createLeaf(-0.55, -1.0, 0, 0.65, 0.8);
createLeaf( 0.55, -0.45, 0, 0.70, -0.8);
createLeaf(-0.65,  0.2, 0, 0.75, 0.85);
createLeaf( 0.65,  0.85, 0, 0.80, -0.85);
createLeaf(-0.45,  1.35, 0, 0.60, 0.75);

// =========================
// ENVIRONMENT CONTROLS
// =========================

const waterInput = document.getElementById('water');
const lightInput = document.getElementById('light');

document.getElementById('water-value').textContent = water + '%';
document.getElementById('light-value').textContent = light + '%';

waterInput.addEventListener('input', () => {
    water = Number(waterInput.value);

    document.getElementById('water-value').textContent =
        water + '%';

    if (seedIsPlanted && water >= 50) {
        germinationStarted = true;
        sproutGroup.visible = true;
        plantGroup.visible = false;
    }
});

lightInput.addEventListener('input', () => {
    light = Number(lightInput.value);

    document.getElementById('light-value').textContent =
        light + '%';
});

// =========================
// PLANT CONDITION
// =========================

function updateCondition(delta) {
    const severeStress = water < 25 || light < 25;
    const extremeLevel = water > 95 || light > 95;

    if (severeStress) {
        plantStress = Math.min(1, plantStress + delta * 0.12);
    } else {
        plantStress = Math.max(0, plantStress - delta * 0.04);
    }

    if (severeStress) {
        health -= 3 * delta;
    } else if (extremeLevel) {
        health -= 0.8 * delta;
    } else {
        health += 0.8 * delta;
    }

    health = THREE.MathUtils.clamp(health, 0, 100);

    let status;

    if (health >= 60) {
        status = 'Healthy';
    } else if (health >= 30) {
        status = 'Stressed';
    } else if (health > 0) {
        status = 'Withering';
    } else {
        status = 'Critical';
    }

    document.getElementById('status').textContent = status;
    document.getElementById('health-bar').style.width = health + '%';

    const healthBar = document.getElementById('health-bar');

    if (health >= 60) {
        healthBar.style.background = '#81c784';
    } else if (health >= 30) {
        healthBar.style.background = '#e0b85c';
    } else {
        healthBar.style.background = '#bd795d';
    }

    // The stem changes colour according to plant condition.
    const dryness = 1 - health / 100;
    const visibleDryness = Math.max(0, (dryness - 0.3) / 0.7);

    blenderStemMaterials.forEach((material) => {
    material.color
        .copy(healthyGreen)
        .lerp(dryBrown, visibleDryness * 0.65);
    });

    // Calculate sunlight stress ONCE per frame.
    const sunburnTarget = THREE.MathUtils.clamp(
        (light - 75) / 25,
        0,
        1
    );

    currentSunburn = THREE.MathUtils.damp(
        currentSunburn,
        sunburnTarget,
        1.5,
        delta
    );

    // Gradually droop and restore all five main leaves.
    for (const leaf of allLeaves) {
        const currentDroop = leafDroopAmounts.get(leaf) ?? 0;

        const targetDroop = Math.max(
            plantStress * 0.65,
            currentSunburn * 0.65
        );

        const nextDroop = THREE.MathUtils.damp(
            currentDroop,
            targetDroop,
            2,
            delta
        );

        leafDroopAmounts.set(leaf, nextDroop);

        const originalX = leaf.userData.originalRotationX ?? 0.15;
        leaf.rotation.x = originalX + nextDroop;
    }

    // Gradually change the colour of every main leaf.
    for (const leaf of allLeaves) {
        const burnAmount = Math.max(
            visibleDryness * 0.65,
            currentSunburn * 0.9
        );

        leaf.material.color
            .copy(leaf.userData.baseColor)
            .lerp(dryBrown, burnAmount);

        if (leaf === selectedLeaf && currentSunburn === 0) {
            leaf.material.color.lerp(highlightedGreen, 0.55);
        }
    }
}

// =========================
// INTERACTION
// =========================

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let selectedLeaf = null;

window.addEventListener('click', (event) => {
    if (event.target.closest('#controls')) {
        return;
    }

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(
    allSproutLeaves.filter(leaf => leaf.visible),
    false
);

    if (intersects.length === 0) {
        return;
    }
    console.log('Leaf clicked!', intersects[0].object);

    selectedLeaf = intersects[0].object;

    let stemPoint = null;
let minDistance = Infinity;

blenderStemModel.updateMatrixWorld(true);
sproutGroup.updateMatrixWorld(true);

blenderStemModel.traverse((child) => {
    if (!child.isMesh) return;

    const positions = child.geometry.attributes.position;
    const vertex = new THREE.Vector3();

    for (let i = 0; i < positions.count; i++) {
        vertex.fromBufferAttribute(positions, i);
        child.localToWorld(vertex);
        sproutGroup.worldToLocal(vertex);

        const distance = vertex.distanceToSquared(
            selectedLeaf.position
        );

        if (distance < minDistance) {
            minDistance = distance;
            stemPoint = vertex.clone();
        }
    }
});

if (!stemPoint) return;

const newX = stemPoint.x;
const newY = stemPoint.y;
const newZ = stemPoint.z;

const newRotation = selectedLeaf.rotation.z +
    (Math.random() - 0.5) * 0.4;

    const newLeaf = createSproutLeaf(
    newX,
    newY,
    newRotation,
    false
);

newLeaf.position.z = newZ + 0.01;
newLeaf.scale.set(0.001, 0.001, 0.2);
newLeaf.visible = true;

newLeaf.userData.targetScale = 0.7;
growingSproutLeaves.push(newLeaf);
});

// =========================
// ANIMATION
// =========================

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    // The plant slowly consumes water after it is planted.
    if (seedIsPlanted && water > 0) {
        water = Math.max(0, water - delta * 0.5);
        waterInput.value = water;

        document.getElementById('water-value').textContent =
            Math.round(water) + '%';
    }

    // Germination and continued growth.
    if (germinationStarted) {
        if (germinationProgress < 1) {
            germinationProgress = Math.min(
                1,
                germinationProgress + delta * 0.2
            );
        }

        const germinationScale = Math.max(0.01, germinationProgress);

        // Gradual growth of all six leaves.
const matureLeafScale = 1 + THREE.MathUtils.clamp(
    continuedGrowth / 1.5,
    0,
    1
) * 1.2;

// First pair of leaves.
const leftLeafGrowth = THREE.MathUtils.clamp(
    (stemGrowth - 0.14) / 0.10,
    0,
    1
);

const rightLeafGrowth = THREE.MathUtils.clamp(
    (stemGrowth - 0.20) / 0.10,
    0,
    1
);

sproutLeafLeft.visible = leftLeafGrowth > 0;
sproutLeafRight.visible = rightLeafGrowth > 0;

sproutLeafLeft.scale.set(
    1.2 * leftLeafGrowth * matureLeafScale,
    0.55 * leftLeafGrowth * matureLeafScale,
    0.2
);

sproutLeafRight.scale.set(
    1.2 * rightLeafGrowth * matureLeafScale,
    0.55 * rightLeafGrowth * matureLeafScale,
    0.2
);

// Second pair of leaves.
const secondPairGrowth = THREE.MathUtils.clamp(
    (continuedGrowth - 0.2) / 0.25,
    0,
    1
);

sproutLeafLeft2.visible = secondPairGrowth > 0;
sproutLeafRight2.visible = secondPairGrowth > 0;

sproutLeafLeft2.scale.set(
    1.2 * secondPairGrowth * matureLeafScale,
    0.55 * secondPairGrowth * matureLeafScale,
    0.2
);

sproutLeafRight2.scale.set(
    1.2 * secondPairGrowth * matureLeafScale,
    0.55 * secondPairGrowth * matureLeafScale,
    0.2
);

// Third pair of leaves.
const thirdPairGrowth = THREE.MathUtils.clamp(
    (continuedGrowth - 0.5) / 0.25,
    0,
    1
);

sproutLeafLeft3.visible = thirdPairGrowth > 0;
sproutLeafRight3.visible = thirdPairGrowth > 0;

sproutLeafLeft3.scale.set(
    1.2 * thirdPairGrowth * matureLeafScale,
    0.55 * thirdPairGrowth * matureLeafScale,
    0.2
);

sproutLeafRight3.scale.set(
    1.2 * thirdPairGrowth * matureLeafScale,
    0.55 * thirdPairGrowth * matureLeafScale,
    0.2
);

        // Continue growth when water and light are sufficient.
        if (germinationProgress >= 1 && water >= 20 && light >= 20) {
            continuedGrowth = Math.min(
                4,
                continuedGrowth +
                    delta * 0.03 * (water / 100) * (light / 100)
            );
        }

        stemGrowth = Math.min(
             1,
        stemGrowth + delta * 0.01 * (water / 100) * (light / 100)
        );

        // Bud growth.
        const budGrowth = THREE.MathUtils.clamp(
            (continuedGrowth - 1.2) / 0.8,
            0,
            1
        );

        const budScale = Math.max(0.001, budGrowth);

        bud.scale.set(budScale, budScale, budScale);

        const flowerOpen = THREE.MathUtils.clamp(
            (continuedGrowth - 2.0) / 0.8,
            0,
            1
        );

        const witherProgress = THREE.MathUtils.clamp(
            (continuedGrowth - 3.5) / 0.5,
            0,
            1
        );

        if (witherProgress >= 1 && !seedsCollected) {
            collectSeedsButton.style.display = 'block';
        }

        petals.forEach((petal, index) => {
            const angle = (index / petals.length) * Math.PI * 2;

            petal.position.set(
                Math.cos(angle) * 0.09 * flowerOpen,
                Math.sin(angle) * 0.09 * flowerOpen,
                0
            );

            const petalSize = flowerOpen * (1 - 0.75 * witherProgress);

            petal.scale.set(
                Math.max(0.001, 0.001 + 0.9 * petalSize),
                Math.max(0.001, 0.001 + 0.55 * petalSize),
                0.3
            );

            petal.material.color
                .set(0xe88bb5)
                .lerp(new THREE.Color(0x806b70), witherProgress);
        });

        // Flower centre.
        const centerScale = THREE.MathUtils.clamp(
            (flowerOpen - 0.5) / 0.5,
            0,
            1
        );

        flowerCenter.scale.setScalar(Math.max(0.001, centerScale));

        // Seeds develop after the flower opens.
        const seedGrowth = THREE.MathUtils.clamp(
            (flowerOpen - 0.8) / 0.2,
            0,
            1
        );

        seeds.forEach((flowerSeed, index) => {
            const scale = Math.max(0.001, seedGrowth);
            const angle = (index / seeds.length) * Math.PI * 2;

            flowerSeed.position.set(
                Math.cos(angle) * 0.045,
                Math.sin(angle) * 0.045,
                0.16
            );

            flowerSeed.scale.setScalar(0.35 * scale);
        });

        flowerCenter.position.set(0, 0, 0.08);

        
        // Whole sprout and height.
        const stillGerminating = germinationProgress < 1;

        if (blenderStemModel) {
        blenderStemModel.scale.y = 3 * Math.max(0.01, stemGrowth);

        blenderStemModel.position.y =
        -blenderStemModel.userData.originalMinY *
        blenderStemModel.scale.y;

        if (blenderStemModel.userData.tipLocal) {
        const budTip = blenderStemModel.localToWorld(
        blenderStemModel.userData.tipLocal.clone()
        );

        sproutGroup.worldToLocal(budTip);
        bud.position.copy(budTip);
        }
    }
        updateSproutLeafPositions();

        sproutGroup.scale.set(
            stillGerminating ? germinationScale : 1,
            stillGerminating ? germinationScale : 1,
            stillGerminating ? germinationScale : 1
        );

        sproutGroup.rotation.y += delta * 0.3;

        // Smooth plant tilt towards the mouse
            currentTiltX = THREE.MathUtils.lerp(currentTiltX, targetTiltX, 0.04);
            currentTiltZ = THREE.MathUtils.lerp(currentTiltZ, targetTiltZ, 0.04);

            sproutGroup.rotation.x = currentTiltX;
        sproutGroup.rotation.z = currentTiltZ;

        // Sprout colour responds to health and sunlight.
        const sproutDryness = 1 - health / 100;

        const visibleSproutDryness = Math.max(
            0,
            (sproutDryness - 0.3) / 0.7
        );

        const sproutColour = healthyGreen.clone().lerp(
            dryBrown,
            Math.max(
                visibleSproutDryness * 0.65,
                currentSunburn * 0.9
            )
        );

        sproutMaterial.color.copy(sproutColour);

        // All six young leaves droop and recover smoothly.
        const sproutDroop = Math.max(
            plantStress * 0.65,
            currentSunburn * 0.65
        );

        const leafDryness = Math.max(
            0,
            (1 - health / 100 - 0.3) / 0.7
        );

        const leafBurnAmount = Math.max(
            leafDryness * 0.65,
            currentSunburn * 0.9
        );

        const leafColour = healthyGreen.clone().lerp(
            dryBrown,
            leafBurnAmount
        );

        for (const leaf of allSproutLeaves) {
            leaf.material.color.copy(leafColour);

            leaf.rotation.z =
                leaf.userData.originalRotationZ +
                leaf.userData.droopDirection * sproutDroop;
        }
        // Extra leaves respond to plant condition too.
        for (const leaf of extraSproutLeaves) {
                 leaf.material.color.copy(leafColour);

                leaf.rotation.z =
                leaf.userData.originalRotationZ +
                leaf.userData.droopDirection * sproutDroop;
}
    }

    // New leaves grow gradually.
    const conditions = Math.min(water, light) / 100;
    const growthMultiplier = 0.2 + conditions * 1.3;
    const healthMultiplier = 0.25 + (health / 100) * 0.75;

    for (const leaf of growingLeaves) {
        const target = leaf.userData.targetScale;

        if (leaf.scale.x < target) {
            const nextScale = Math.min(
                target,
                leaf.scale.x +
                    0.45 * delta *
                    growthMultiplier *
                    healthMultiplier
            );

            leaf.scale.set(nextScale, nextScale, nextScale);
        }
    }
// New sprout leaves grow gradually.
for (const leaf of growingSproutLeaves) {
    const target = leaf.userData.targetScale;
    const currentScale = leaf.scale.x / 1.2;

    if (currentScale < target) {
        const nextScale = Math.min(
            target,
            currentScale +
                0.45 * delta *
                growthMultiplier *
                healthMultiplier
        );

        leaf.scale.set(
            1.2 * nextScale,
            0.55 * nextScale,
            0.2
        );
    }
}
    updateCondition(delta);
    renderer.render(scene, camera);
}

// =========================
// BUTTONS
// =========================

plantSeedButton.addEventListener('click', () => {
    seed.position.y = -1.55;
    seedIsPlanted = true;
    seedsCollected = false;

   plantGroup.visible = false;

    if (water >= 20) {
        germinationStarted = true;
        sproutGroup.visible = true;
    }

    plantSeedButton.textContent = 'Seed planted';
    plantSeedButton.disabled = true;
});

collectSeedsButton.addEventListener('click', () => {
    seedsCollected = true;
    collectSeedsButton.style.display = 'none';

    sproutGroup.visible = false;
    sproutGroup.scale.set(0.01, 0.01, 0.01);

    seed.position.y = -1.3;
    seedIsPlanted = false;

    germinationProgress = 0;
    germinationStarted = false;
    continuedGrowth = 0;

    bud.scale.set(0.001, 0.001, 0.001);
    flowerCenter.scale.set(0.001, 0.001, 0.001);

    petals.forEach(petal => {
        petal.scale.set(0.001, 0.001, 0.001);
        petal.material.color.set(0xe88bb5);
    });

    seeds.forEach(flowerSeed => {
        flowerSeed.scale.set(0.001, 0.001, 0.001);
    });

   

    allSproutLeaves.forEach(leaf => {
        leaf.visible = false;
        leaf.scale.set(0, 0, 0.2);
    });

    plantSeedButton.disabled = false;
    plantSeedButton.textContent = 'Plant seed';
});

// =========================
// START
// =========================

animate();

// =========================
// WINDOW RESIZE
// =========================

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>
</body>
