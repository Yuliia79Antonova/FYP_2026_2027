<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Plant Prototype</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';


// =========================
// SCENE
// =========================

const scene = new THREE.Scene();


// =========================
// PLANT GROUP
// =========================

const plantGroup = new THREE.Group();

scene.add(plantGroup);


// =========================
// CAMERA
// =========================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0.5, 7);


// =========================
// RENDERER
// =========================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


// =========================
// STEM
// =========================

const stemGeometry = new THREE.CylinderGeometry(
    0.22,
    0.32,
    4.5,
    16
);

const stemMaterial = new THREE.MeshBasicMaterial({
    color: 0x3f8f5f
});

const stem = new THREE.Mesh(
    stemGeometry,
    stemMaterial
);

plantGroup.add(stem);


// =========================
// LEAF MATERIAL
// =========================

const leafMaterial = new THREE.MeshBasicMaterial({
    color: 0x4f9d69,
    side: THREE.DoubleSide
});


// =========================
// LEAF SHAPE
// =========================
//
// Narrow at the base,
// wider in the middle,
// pointed at the tip.
//

function createLeaf(
    x,
    y,
    z,
    size,
    rotationZ
) {

    const shape = new THREE.Shape();

    // Narrow base of the leaf
    shape.moveTo(0, 0);

    // LEFT SIDE
    shape.bezierCurveTo(
        -0.15, 0.35,
        -0.75, 0.65,
        -0.95, 1.25
    );

    // Left side narrowing toward the tip
    shape.bezierCurveTo(
        -0.65, 1.85,
        -0.25, 2.25,
        0, 2.6
    );

    // RIGHT SIDE from the sharp tip
    shape.bezierCurveTo(
        0.25, 2.25,
        0.65, 1.85,
        0.95, 1.25
    );

    // Right side back to the narrow base
    shape.bezierCurveTo(
        0.75, 0.65,
        0.15, 0.35,
        0, 0
    );


    // Create a thin 3D leaf
    const geometry = new THREE.ExtrudeGeometry(
        shape,
        {
            depth: 0.10,
            bevelEnabled: true,
            bevelThickness: 0.025,
            bevelSize: 0.025,
            bevelSegments: 2
        }
    );


    const leaf = new THREE.Mesh(
        geometry,
        leafMaterial
    );


    leaf.scale.set(
        size,
        size,
        size
    );

    leaf.position.set(
        x,
        y,
        z
    );

    leaf.rotation.z = rotationZ;

    // Slight 3D angle
    leaf.rotation.x = 0.15;

    plantGroup.add(leaf);
}


// =========================
// LEAVES
// =========================

// Lower left
createLeaf(
    -0.55,
    -1.0,
    0,
    0.65,
    0.8
);


// Lower right
createLeaf(
    0.55,
    -0.45,
    0,
    0.7,
    -0.8
);


// Middle left
createLeaf(
    -0.65,
    0.2,
    0,
    0.75,
    0.85
);


// Middle right
createLeaf(
    0.65,
    0.85,
    0,
    0.8,
    -0.85
);


// Upper left
createLeaf(
    -0.45,
    1.35,
    0,
    0.6,
    0.75
);


// =========================
// ANIMATION
// =========================

function animate() {

    requestAnimationFrame(animate);

    // Rotate the whole plant
    plantGroup.rotation.y += 0.01;

    renderer.render(
        scene,
        camera
    );
}

animate();


// =========================
// WINDOW RESIZE
// =========================

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>

</html>
