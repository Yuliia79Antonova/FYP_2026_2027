<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Plant Prototype</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';


// =========================
// SCENE
// =========================

const scene = new THREE.Scene();


// =========================
// PLANT GROUP
// =========================

const plantGroup = new THREE.Group();

scene.add(plantGroup);


// =========================
// CAMERA
// =========================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0.5, 7);


// =========================
// RENDERER
// =========================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


// =========================
// STEM
// =========================

const stemGeometry = new THREE.CylinderGeometry(
    0.22,
    0.32,
    4.5,
    16
);

const stemMaterial = new THREE.MeshBasicMaterial({
    color: 0x3f8f5f
});

const stem = new THREE.Mesh(
    stemGeometry,
    stemMaterial
);

plantGroup.add(stem);


// =========================
// LEAF MATERIAL
// =========================

const leafMaterial = new THREE.MeshBasicMaterial({
    color: 0x4f9d69,
    side: THREE.DoubleSide
});


// =========================
// LEAF SHAPE
// =========================

function createLeaf(
    x,
    y,
    z,
    size,
    rotationZ
) {

    const shape = new THREE.Shape();

    // Narrow base
    shape.moveTo(0, 0);

    // Left side
    shape.bezierCurveTo(
        -0.15, 0.35,
        -0.75, 0.65,
        -0.95, 1.25
    );

    // Toward tip
    shape.bezierCurveTo(
        -0.65, 1.85,
        -0.25, 2.25,
        0, 2.6
    );

    // Right side
    shape.bezierCurveTo(
        0.25, 2.25,
        0.65, 1.85,
        0.95, 1.25
    );

    // Back to base
    shape.bezierCurveTo(
        0.75, 0.65,
        0.15, 0.35,
        0, 0
    );


    // 3D leaf
    const geometry = new THREE.ExtrudeGeometry(
        shape,
        {
            depth: 0.10,
            bevelEnabled: true,
            bevelThickness: 0.025,
            bevelSize: 0.025,
            bevelSegments: 2
        }
    );


    const leaf = new THREE.Mesh(
        geometry,
        leafMaterial.clone()
    );


    leaf.scale.set(
        size,
        size,
        size
    );

    leaf.position.set(
        x,
        y,
        z
    );

    leaf.rotation.z = rotationZ;

    leaf.rotation.x = 0.15;


    plantGroup.add(leaf);

    return leaf;
}


// =========================
// ORIGINAL LEAVES
// =========================

createLeaf(
    -0.55,
    -1.0,
    0,
    0.65,
    0.8
);

createLeaf(
    0.55,
    -0.45,
    0,
    0.7,
    -0.8
);

createLeaf(
    -0.65,
    0.2,
    0,
    0.75,
    0.85
);

createLeaf(
    0.65,
    0.85,
    0,
    0.8,
    -0.85
);

createLeaf(
    -0.45,
    1.35,
    0,
    0.6,
    0.75
);


// =========================
// INTERACTION
// =========================

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

let selectedLeaf = null;

let growingLeaves = [];


// =========================
// MOUSE CLICK
// =========================

window.addEventListener(
    'click',
    (event) => {

        mouse.x =
            (event.clientX / window.innerWidth) * 2 - 1;

        mouse.y =
            -(event.clientY / window.innerHeight) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const intersects =
            raycaster.intersectObjects(
                plantGroup.children
            );


        if (intersects.length === 0) {
            return;
        }


        const object =
            intersects[0].object;


        // Ignore stem
        if (object === stem) {
            return;
        }


        // Highlight clicked leaf

        object.material.color.set(
            0x7fdc8f
        );


        // =========================
        // CREATE NEW LEAF
        // =========================

        const newX =
            (Math.random() - 0.5) * 1.8;

        const newY =
            Math.random() * 3.5 - 1.3;

        const newZ =
            (Math.random() - 0.5) * 0.5;

        const newRotation =
            (Math.random() - 0.5) * 1.6;


        const newLeaf =
            createLeaf(
                newX,
                newY,
                newZ,
                0.01,
                newRotation
            );


        // Target size

        newLeaf.userData.targetScale =
            0.55 + Math.random() * 0.25;


        // Add to growing list

        growingLeaves.push(
            newLeaf
        );

    }
);


// =========================
// ANIMATION
// =========================

function animate() {

    requestAnimationFrame(
        animate
    );


    // Rotate plant

    plantGroup.rotation.y += 0.01;


    // =========================
    // GROW NEW LEAVES
    // =========================

    growingLeaves.forEach(
        (leaf) => {

            const target =
                leaf.userData.targetScale;


            if (leaf.scale.x < target) {

                const newScale =
                    leaf.scale.x + 0.02;


                leaf.scale.set(
                    newScale,
                    newScale,
                    newScale
                );

            }

        }
    );


    renderer.render(
        scene,
        camera
    );
}

animate();


// =========================
// WINDOW RESIZE
// =========================

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>
